<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Leaflet.markercluster: custom clusters</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
	<link rel="stylesheet" href="../src/MarkerCluster.Default.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
	</script>
	<link rel="stylesheet" href="demo.css">
	<style>
		.mycluster {
			width: 40px;
			height: 40px;
			background-color: greenyellow;
			text-align: center;
			line-height: 40px;
			font-size: 24px;
		}
	</style>
</head>
<body>

<p>
	Custom cluster icons that show the sum of their markers' numbers, a larger cluster radius, and the default
	click and hover behavior turned off. Hovering over a cluster fades it and shows its convex hull instead.
	<a href="index.html">All demos</a>.
</p>

<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer, Marker, DivIcon, Polygon} from 'leaflet';
	import {MarkerClusterGroup} from '../src/index.js';

	const map = new LeafletMap('map').setView([50.5, 30.51], 15);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 18,
		attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	const markers = new MarkerClusterGroup({
		maxClusterRadius: 120,
		iconCreateFunction(cluster) {
			const sum = cluster.getAllChildMarkers().reduce((n, marker) => n + marker.number, 0);
			return new DivIcon({html: sum, className: 'mycluster', iconSize: [40, 40]});
		},
		// turn off the default behavior
		spiderfyOnMaxZoom: false,
		showCoverageOnHover: false,
		zoomToBoundsOnClick: false
	});

	for (let i = 0; i < 100; i++) {
		const marker = new Marker(randomLatLng(), {title: i});
		marker.number = i;
		markers.addLayer(marker);
	}
	map.addLayer(markers);

	let hovered, hull;

	function removeHull() {
		hovered?.setOpacity(1);
		hull?.remove();
		hovered = hull = null;
	}

	markers.on('clustermouseover', (e) => {
		removeHull();
		hovered = e.layer.setOpacity(0.2);
		hull = new Polygon(e.layer.getConvexHull()).addTo(map);
	});
	markers.on('clustermouseout', removeHull);
	map.on('zoomend', removeHull);

	// random positions within the current view
	function randomLatLng() {
		const bounds = map.getBounds();
		const sw = bounds.getSouthWest();
		const ne = bounds.getNorthEast();
		return [sw.lat + (ne.lat - sw.lat) * Math.random(), sw.lng + (ne.lng - sw.lng) * Math.random()];
	}
</script>
</body>
</html>
