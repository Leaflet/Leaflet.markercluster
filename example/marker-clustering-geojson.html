<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Leaflet.markercluster: GeoJSON and mixed layers</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
	<link rel="stylesheet" href="../src/MarkerCluster.Default.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
	</script>
	<link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
	A GeoJSON layer with points, lines and polygons, plus a few separate markers and a polyline, all in one group.
	Only markers cluster; the other layers are added as they are.
	<a href="index.html">All demos</a>.
</p>

<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer, Marker, Polyline, GeoJSON} from 'leaflet';
	import {MarkerClusterGroup} from '../src/index.js';

	const map = new LeafletMap('map').setView([0.78, 102.37], 7);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 18,
		attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	const geojsonSample = {
		type: 'FeatureCollection',
		features: [
			{type: 'Feature', geometry: {type: 'Point', coordinates: [102.0, 0.5]}, properties: {color: 'blue'}},
			{type: 'Feature', geometry: {type: 'LineString', coordinates: [[102, 0], [103, 1], [104, 0], [105, 1]]}, properties: {color: 'red'}},
			{type: 'Feature', geometry: {type: 'Polygon', coordinates: [[[100, 0], [101, 0], [101, 1], [100, 1], [100, 0]]]}, properties: {color: 'green'}},
			{type: 'Feature', geometry: {type: 'MultiPolygon', coordinates: [
				[[[100, 1.5], [100.5, 1.5], [100.5, 2], [100, 2], [100, 1.5]]],
				[[[100.5, 2], [100.5, 2.5], [101, 2.5], [101, 2], [100.5, 2]]]
			]}, properties: {color: 'purple'}}
		]
	};

	const geojson = new GeoJSON(geojsonSample, {
		style: feature => ({color: feature.properties.color}),
		onEachFeature(feature, layer) {
			layer.bindPopup(`geometry type: ${feature.geometry.type}<br>color: ${feature.properties.color}`);
		}
	});
	geojson.addLayer(new Marker([2.745531, 105.194092]));

	// a face
	const eye1 = new Marker([-0.725078, 101.821289]);
	const eye2 = new Marker([-0.736064, 103.227539]);
	const nose = new Marker([-1.329226, 102.546387]);
	const mouth = new Polyline([
		[-1.384143, 101.733398], [-1.603794, 101.964111], [-1.680667, 102.249756],
		[-1.735574, 102.678223], [-1.592812, 103.007813], [-1.329226, 103.31543]
	]);

	new MarkerClusterGroup().addLayer(geojson).addLayers([eye1, eye2, nose, mouth]).addTo(map);
</script>
</body>
</html>
