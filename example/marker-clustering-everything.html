<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Leaflet.markercluster: adding, removing and moving markers</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
	<link rel="stylesheet" href="../src/MarkerCluster.Default.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
	</script>
	<link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
	Markers added and removed one by one with <code>animateAddingMarkers</code>:
	<button id="add">Add a marker</button> <button id="remove">Remove a marker</button>
	<button id="move">Move a random marker</button>. Markers are draggable, and the clusters follow.
	<a href="index.html">All demos</a>.
</p>

<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer, Marker} from 'leaflet';
	import {MarkerClusterGroup} from '../src/index.js';

	const map = new LeafletMap('map').setView([50.5, 30.51], 15);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 18,
		attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	const markers = new MarkerClusterGroup({animateAddingMarkers: true});
	const markerList = [];

	for (let i = 0; i < 100; i++) {
		const marker = new Marker(randomLatLng(), {draggable: true});
		markerList.push(marker);
		markers.addLayer(marker);
	}
	map.addLayer(markers);

	document.getElementById('add').onclick = () => {
		const marker = new Marker(map.getCenter(), {draggable: true});
		markerList.push(marker);
		markers.addLayer(marker);
	};
	document.getElementById('remove').onclick = () => {
		if (markerList.length) markers.removeLayer(markerList.pop());
	};
	document.getElementById('move').onclick = () => {
		markerList[Math.floor(Math.random() * markerList.length)]?.setLatLng(map.getCenter());
	};

	// random positions within the current view
	function randomLatLng() {
		const bounds = map.getBounds();
		const sw = bounds.getSouthWest();
		const ne = bounds.getNorthEast();
		return [sw.lat + (ne.lat - sw.lat) * Math.random(), sw.lng + (ne.lng - sw.lng) * Math.random()];
	}
</script>
</body>
</html>
