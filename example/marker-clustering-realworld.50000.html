<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Leaflet.markercluster: 50,000 markers</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
	<link rel="stylesheet" href="../src/MarkerCluster.css">
	<link rel="stylesheet" href="../src/MarkerCluster.Default.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
	</script>
	<link rel="stylesheet" href="demo.css">
	<style>
		#progress {
			display: none;
			position: absolute;
			z-index: 1000;
			left: calc(50% - 100px);
			top: calc(50% - 10px);
			width: 200px;
			height: 20px;
			background: rgb(255 255 255 / 0.7);
			border-radius: 4px;
			padding: 2px;
		}
		#progress-bar {
			width: 0;
			height: 100%;
			background: #76a6fc;
			border-radius: 4px;
		}
	</style>
</head>
<body>

<p>
	50,000 address points clustered by Leaflet.markercluster, added in chunks with a progress bar that shows
	up if loading takes longer than a second.
	<a href="index.html">All demos</a>.
</p>

<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer, Marker} from 'leaflet';
	import {MarkerClusterGroup} from '../src/index.js';

	const map = new LeafletMap('map').setView([-37.79, 175.27], 13);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 18,
		attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, points &copy; 2012 LINZ'
	}).addTo(map);

	const progress = document.createElement('div');
	progress.id = 'progress';
	progress.innerHTML = '<div id="progress-bar"></div>';
	map.getContainer().append(progress);

	function updateProgress(processed, total, elapsed) {
		// only show the progress bar if loading takes more than a second
		if (elapsed > 1000) {
			progress.style.display = 'block';
			progress.firstChild.style.width = `${Math.round(processed / total * 100)}%`;
		}
		if (processed === total) progress.style.display = 'none';
	}

	const points = await (await fetch('realworld.50000.json')).json();
	const markers = new MarkerClusterGroup({chunkedLoading: true, chunkProgress: updateProgress});

	markers.addLayers(points.map(([lat, lng, title]) => new Marker([lat, lng], {title}).bindPopup(title)));
	map.addLayer(markers);
</script>
</body>
</html>
