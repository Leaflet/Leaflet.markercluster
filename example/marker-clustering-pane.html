<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Leaflet.markercluster: clusterPane</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
	<link rel="stylesheet" href="../src/MarkerCluster.Default.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
	</script>
	<link rel="stylesheet" href="demo.css">
	<style>
		.myclusterA, .myclusterB {
			width: 40px;
			height: 40px;
			text-align: center;
			line-height: 40px;
			font-size: 24px;
		}
		.myclusterA { background-color: greenyellow; }
		.myclusterB { background-color: red; }
	</style>
</head>
<body>

<p>
	Two groups, one in the default marker pane and one with <code>clusterPane</code> set to a custom pane
	above it, so its clusters always stay on top.
	<a href="index.html">All demos</a>.
</p>

<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer, Marker, DivIcon} from 'leaflet';
	import {MarkerClusterGroup} from '../src/index.js';

	const map = new LeafletMap('map').setView([50.5, 30.51], 15);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 18,
		attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	// a pane above the default marker pane
	map.createPane('paneB').style.zIndex = 610;

	function createGroup(className, clusterPane) {
		const markers = new MarkerClusterGroup({
			maxClusterRadius: 120,
			iconCreateFunction(cluster) {
				const sum = cluster.getAllChildMarkers().reduce((n, marker) => n + marker.number, 0);
				return new DivIcon({html: sum, className, iconSize: [40, 40]});
			},
			spiderfyOnMaxZoom: false,
			showCoverageOnHover: false,
			zoomToBoundsOnClick: false,
			...(clusterPane && {clusterPane})
		});
		for (let i = 0; i < 100; i++) {
			const marker = new Marker(randomLatLng(), {title: i});
			marker.number = i;
			markers.addLayer(marker);
		}
		return markers.addTo(map);
	}

	createGroup('myclusterA');
	createGroup('myclusterB', 'paneB');

	// random positions within the current view
	function randomLatLng() {
		const bounds = map.getBounds();
		const sw = bounds.getSouthWest();
		const ne = bounds.getNorthEast();
		return [sw.lat + (ne.lat - sw.lat) * Math.random(), sw.lng + (ne.lng - sw.lng) * Math.random()];
	}
</script>
</body>
</html>
