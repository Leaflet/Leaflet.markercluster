name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # demos import ../src, so keep the repo layout; the root redirects to the demos. dist/ serves the frozen
      # gh-pages snapshot for old pages hotlinking it (to be removed with 2.0.0 final), so v2 builds go to dist-v2/
      - run: |
          mkdir _site
          cp -r example src _site/
          cp -r dist _site/dist-v2
          git fetch --depth=1 origin gh-pages
          git archive FETCH_HEAD dist | tar -x -C _site
          sed -i 's|\.\./dist/|../dist-v2/|g' _site/example/global.html
          echo '<meta http-equiv="refresh" content="0; url=example/">' > _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
